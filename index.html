<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>扫光标题制作器</title>
<style>
:root{--bg:#0e1013;--panel:#171a1f;--panel2:#1d2127;--line:#30353d;--text:#f5f6f8;--muted:#969da7;--gold:#f5c95b;--blue:#5ba7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,"Microsoft YaHei",sans-serif;letter-spacing:0}button,input{font:inherit}button{color:inherit}.top{height:68px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;background:#14161a;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:11px}.brand i{font-style:normal;color:var(--gold);font-size:24px}.brand h1{font-size:17px;margin:0}.brand small{display:block;color:var(--muted);margin-top:2px}.actions{display:flex;gap:9px}.btn{height:36px;padding:0 14px;border:1px solid var(--line);border-radius:6px;background:#252930;cursor:pointer;font-weight:600}.btn:hover:not(:disabled){background:#30353c}.btn.primary{border:0;background:var(--gold);color:#211b0d}.btn:disabled{opacity:.38;cursor:not-allowed}.app{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:calc(100vh - 68px)}aside{background:var(--panel);border-right:1px solid var(--line);overflow:auto}.section{padding:19px 20px;border-bottom:1px solid var(--line)}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.section h2{font-size:12px;margin:0}.note,output{font-size:11px;color:var(--muted)}.drop{height:108px;border:1px dashed #515862;border-radius:7px;background:#1d2025;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer}.drop:hover,.drop.drag{border-color:var(--gold);background:#25251f}.drop b{font-size:13px}.upload{color:var(--gold);font-size:22px}.row{display:grid;grid-template-columns:1fr auto;gap:6px 10px;margin:0 0 15px;font-size:12px}.row input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--gold)}.switch{display:flex;align-items:center;justify-content:space-between;font-size:12px;margin:14px 0}.switch input{accent-color:var(--gold)}.mode{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;padding:4px;background:#22262c;border-radius:6px}.mode button{height:30px;border:0;border-radius:4px;background:transparent;color:var(--muted);font-size:11px;cursor:pointer}.mode button.on{background:#3a4048;color:white}.tip{padding:10px;margin-top:12px;border-left:2px solid var(--blue);background:#20252b;color:#aab1ba;font-size:11px;line-height:1.55}.color-dot{width:20px;height:20px;border-radius:50%;border:2px solid white;background:#fff;box-shadow:0 0 0 1px #555;display:inline-block;vertical-align:middle}.workspace{padding:18px 22px 22px;display:grid;grid-template-rows:38px minmax(380px,1fr) 60px;min-width:0}.workspace-head{display:flex;justify-content:space-between;align-items:flex-start}.tabs{display:flex;padding:3px;background:#22262c;border-radius:6px}.tabs button{height:27px;padding:0 12px;border:0;border-radius:4px;background:transparent;color:var(--muted);font-size:11px;cursor:pointer}.tabs button.on{background:#3b4149;color:#fff}.status{color:var(--muted);font-size:11px}.previews{display:grid;grid-template-columns:1fr 1fr;gap:14px;min-width:0}.preview{display:grid;grid-template-rows:36px minmax(0,1fr);border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--panel2)}.preview-head{padding:0 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);font-size:12px}.badge{font-size:10px;color:var(--muted)}.stage{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background-color:#292d33;background-image:linear-gradient(45deg,#343941 25%,transparent 25%),linear-gradient(-45deg,#343941 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#343941 75%),linear-gradient(-45deg,transparent 75%,#343941 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}.stage.dark{background:#060708}.stage.light{background:#eef0f3}.stage canvas{max-width:90%;max-height:88%;width:auto;height:auto}.placeholder{text-align:center;color:var(--muted);line-height:1.8}.placeholder i{display:block;font-style:normal;font-size:34px;color:#4d545e}.timeline{padding-top:13px}.timeline input{width:100%;accent-color:var(--gold)}.timeline-foot{display:flex;justify-content:space-between;color:var(--muted);font-size:10px}.eyedrop{cursor:crosshair}.hidden{display:none!important}@media(max-width:900px){.previews{grid-template-columns:1fr}.workspace{grid-template-rows:38px 760px 60px}.app{grid-template-columns:260px 1fr}}@media(max-width:680px){.top{padding:0 12px}.brand small{display:none}.actions .secondary{display:none}.app{display:flex;flex-direction:column-reverse}.workspace{height:830px;padding:12px}.previews{grid-template-columns:1fr}.section{padding:17px 18px}}
</style></head>
<body><header class="top"><div class="brand"><i>✦</i><div><h1>扫光标题制作器</h1><small>透明底 · 三种动态特效</small></div></div><div class="actions"><button id="pngBtn" class="btn secondary" disabled>↓ 透明 PNG</button><button id="webmBtn" class="btn primary" disabled>↓ 导出 WebM</button></div></header>
<main class="app"><aside>
<section class="section"><div class="section-head"><h2>01 图片</h2><span id="size" class="note">未上传</span></div><label id="drop" class="drop"><input id="file" type="file" accept="image/png" hidden><span class="upload">↑</span><b>选择标题图片</b><span class="note">透明底 PNG</span></label><button id="replace" class="btn hidden" style="width:100%;margin-top:9px">↥ 更换图片</button></section>
<section class="section"><div class="section-head"><h2>02 动态特效</h2><button id="resetFx" class="note" style="border:0;background:none;cursor:pointer">重置</button></div><div class="mode" style="margin-bottom:15px"><button id="classicFx" class="on">经典扫光</button><button id="metalFx">金属爆闪</button><button id="flowFx">金色流光</button></div><label class="row"><span id="widthLabel">光带宽度</span><output id="wv">24%</output><input id="width" type="range" min="8" max="55" value="24"></label><label class="row">亮度<output id="iv">78%</output><input id="intensity" type="range" min="20" max="100" value="78"></label><label class="row">缩放幅度<output id="zv">8%</output><input id="zoom" type="range" min="0" max="18" value="8"></label><label class="row">倾斜角度<output id="av">-16°</output><input id="angle" type="range" min="-40" max="10" value="-16"></label><label class="row">扫过时长<output id="sv">1.1 秒</output><input id="sweep" type="range" min="6" max="60" value="11"></label><label class="row">停顿时长<output id="pv">2.5 秒</output><input id="pause" type="range" min="0" max="50" value="25"></label></section>
</aside><section class="workspace"><div class="workspace-head"><div class="tabs"><button class="on" data-bg="checker">透明</button><button data-bg="dark">深色</button><button data-bg="light">浅色</button></div><span id="status" class="status">图片仅在本地处理</span></div>
<div class="previews"><article class="preview"><header class="preview-head"><span>透明底预览</span><span class="badge">保留原始透明通道</span></header><div id="cutStage" class="stage"><div id="empty1" class="placeholder"><i>⌁</i>上传透明 PNG 后查看原图</div><canvas id="cutCanvas" class="hidden"></canvas></div></article><article class="preview"><header class="preview-head"><span>扫光效果预览</span><span id="playState" class="badge">循环播放</span></header><div id="fxStage" class="stage"><div id="empty2" class="placeholder"><i>✦</i>透明 PNG 会自动应用特效</div><canvas id="fxCanvas" class="hidden"></canvas></div></article></div>
<div class="timeline"><input id="timeline" type="range" min="0" max="1000" value="0" disabled><div class="timeline-foot"><span>开始</span><span id="time">0.0 / 3.6 秒</span><span id="cycle">循环 3.6 秒</span></div></div></section></main>
<script>
(function(){var $=function(id){return document.getElementById(id)},src=document.createElement('canvas'),sc=src.getContext('2d',{willReadFrequently:true}),cut=$('cutCanvas'),cc=cut.getContext('2d',{willReadFrequently:true}),fx=$('fxCanvas'),fc=fx.getContext('2d'),mask=document.createElement('canvas'),mc=mask.getContext('2d'),img=null,name='标题',start=performance.now(),processed=null,exporting=false,effect='classic';
function vals(){return{width:+$('width').value/100,intensity:+$('intensity').value/100,zoom:+$('zoom').value/100,angle:+$('angle').value*Math.PI/180,sweep:+$('sweep').value/10,pause:+$('pause').value/10}}function cycle(){var v=vals();return v.sweep+v.pause}
function labels(){$('wv').value=$('width').value+'%';$('iv').value=$('intensity').value+'%';$('zv').value=$('zoom').value+'%';$('av').value=$('angle').value+'°';$('sv').value=(+$('sweep').value/10).toFixed(1)+' 秒';$('pv').value=(+$('pause').value/10).toFixed(1)+' 秒';$('cycle').textContent='循环 '+cycle().toFixed(1)+' 秒'}
function process(){if(!img)return;processed=sc.getImageData(0,0,src.width,src.height);cc.putImageData(processed,0,0);start=performance.now()}
function drawFx(t){if(!processed)return;var w=fx.width,h=fx.height,v=vals(),local=t%cycle(),active=local<v.sweep,p=active?local/v.sweep:1;
fc.globalAlpha=1;fc.globalCompositeOperation='source-over';fc.filter='none';mc.globalAlpha=1;mc.globalCompositeOperation='source-over';mc.filter='none';fc.clearRect(0,0,w,h);mc.clearRect(0,0,w,h);
if(effect==='metal'){var scale;if(p<.42){var q=p/.42;scale=1+v.zoom*(1-q*q)}else if(p<.66){var q2=(p-.42)/.24;scale=1-v.zoom*.12*Math.sin(q2*Math.PI)}else if(p<.84){var q3=(p-.66)/.18;scale=1+v.zoom*.045*Math.sin(q3*Math.PI)}else{scale=1}
fc.save();fc.translate(w/2,h/2);fc.scale(scale,scale);fc.translate(-w/2,-h/2);mc.putImageData(processed,0,0);fc.drawImage(mask,0,0);fc.restore();if(!active)return;
var travel=(1-Math.pow(1-p,2))*(w*.58),bw=Math.max(18,w*v.width*.72),centers=[w/2-travel,w/2+travel];mc.clearRect(0,0,w,h);mc.save();mc.translate(w/2,h/2);mc.scale(scale,scale);mc.translate(-w/2,-h/2);mc.putImageData(processed,0,0);mc.restore();mc.globalCompositeOperation='source-in';
centers.forEach(function(cx){mc.save();mc.translate(cx,h/2);mc.rotate(cx<w/2?-Math.abs(v.angle):Math.abs(v.angle));mc.translate(-cx,-h/2);var gr=mc.createLinearGradient(cx-bw/2,0,cx+bw/2,0);gr.addColorStop(0,'rgba(255,183,55,0)');gr.addColorStop(.22,'rgba(255,213,105,'+(v.intensity*.28)+')');gr.addColorStop(.48,'rgba(255,255,240,'+Math.min(1,v.intensity*1.15)+')');gr.addColorStop(.55,'rgba(255,255,255,'+Math.min(1,v.intensity*1.28)+')');gr.addColorStop(.78,'rgba(255,211,94,'+(v.intensity*.3)+')');gr.addColorStop(1,'rgba(255,174,38,0)');mc.fillStyle=gr;mc.fillRect(cx-bw/2,-h,bw,h*3);mc.restore()});mc.globalCompositeOperation='source-over';
fc.save();fc.globalCompositeOperation='lighter';fc.globalAlpha=1;fc.drawImage(mask,0,0);fc.globalAlpha=.38;fc.filter='blur('+Math.max(2,w*.012)+'px)';fc.drawImage(mask,0,0);fc.filter='none';
var burst=Math.max(0,1-p*1.7),rad=Math.max(24,Math.min(w,h)*(.22+.12*p)),cx=w/2,cy=h/2,flare=fc.createRadialGradient(cx,cy,0,cx,cy,rad);flare.addColorStop(0,'rgba(255,255,255,'+burst+')');flare.addColorStop(.2,'rgba(255,240,177,'+(burst*.75)+')');flare.addColorStop(1,'rgba(255,185,55,0)');fc.fillStyle=flare;fc.fillRect(cx-rad,cy-rad,rad*2,rad*2);
centers.forEach(function(sx){var line=fc.createLinearGradient(sx-w*.2,0,sx+w*.2,0);line.addColorStop(0,'rgba(255,210,95,0)');line.addColorStop(.5,'rgba(255,255,240,'+((1-p)*.8+.15)+')');line.addColorStop(1,'rgba(255,210,95,0)');fc.fillStyle=line;fc.fillRect(sx-w*.2,cy-Math.max(1,h*.008),w*.4,Math.max(2,h*.016))});fc.restore();return}
if(effect==='flow'){var fbw=Math.max(20,w*v.width*1.15),fx0=w*.12,fx1=w*.88,x=fx0+p*(fx1-fx0);if(!active)x=fx1;var zp=1+v.zoom*Math.cos(4*Math.PI*local/cycle());fc.save();fc.translate(w/2,h/2);fc.scale(zp,zp);fc.translate(-w/2,-h/2);fc.drawImage(src,0,0);fc.restore();mc.save();mc.translate(w/2,h/2);mc.scale(zp,zp);mc.translate(-w/2,-h/2);mc.drawImage(src,0,0);mc.globalCompositeOperation='source-in';mc.save();mc.translate(x,h/2);mc.rotate(v.angle);mc.translate(-x,-h/2);var fg=mc.createLinearGradient(x-fbw/2,0,x+fbw/2,0);fg.addColorStop(0,'rgba(255,196,96,0)');fg.addColorStop(.3,'rgba(255,222,140,'+(v.intensity*.2)+')');fg.addColorStop(.5,'rgba(255,255,235,'+Math.min(1,v.intensity*.85)+')');fg.addColorStop(.7,'rgba(255,222,140,'+(v.intensity*.2)+')');fg.addColorStop(1,'rgba(255,196,96,0)');mc.fillStyle=fg;mc.fillRect(x-fbw/2,-h,fbw,h*3);mc.restore();mc.restore();mc.globalCompositeOperation='source-over';fc.save();fc.globalCompositeOperation='lighter';fc.globalAlpha=.9;fc.drawImage(mask,0,0);fc.globalAlpha=.22;fc.filter='blur('+Math.max(2,w*.012)+'px)';fc.drawImage(mask,0,0);fc.filter='none';fc.globalAlpha=1;fc.globalCompositeOperation='source-over';fc.restore();return}
mc.putImageData(processed,0,0);fc.drawImage(mask,0,0);if(!active)return;var ep=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2,bw2=Math.max(16,w*v.width),x=-bw2+ep*(w+bw2*2);mc.globalCompositeOperation='source-in';mc.save();mc.translate(x,h/2);mc.rotate(v.angle);mc.translate(-x,-h/2);var gr2=mc.createLinearGradient(x-bw2/2,0,x+bw2/2,0);gr2.addColorStop(0,'rgba(255,225,140,0)');gr2.addColorStop(.25,'rgba(255,225,140,'+(v.intensity*.25)+')');gr2.addColorStop(.5,'rgba(255,255,255,'+v.intensity+')');gr2.addColorStop(.75,'rgba(255,225,140,'+(v.intensity*.25)+')');gr2.addColorStop(1,'rgba(255,225,140,0)');mc.fillStyle=gr2;mc.fillRect(x-bw2/2,-h,bw2,h*3);mc.restore();mc.globalCompositeOperation='source-over';fc.globalCompositeOperation='lighter';fc.globalAlpha=.85;fc.drawImage(mask,0,0);fc.globalAlpha=.2;fc.filter='blur('+Math.max(1,w*.006)+'px)';fc.drawImage(mask,0,0);fc.filter='none';fc.globalAlpha=1;fc.globalCompositeOperation='source-over';fc.filter='none'}function loop(now){if(processed&&!exporting){var t=(now-start)/1000;drawFx(t);$('timeline').value=Math.round((t%cycle())/cycle()*1000);$('time').textContent=(t%cycle()).toFixed(1)+' / '+cycle().toFixed(1)+' 秒'}requestAnimationFrame(loop)}
function load(file){if(!file)return;if(file.type!=='image/png'){$('status').textContent='请选择透明底 PNG';return}name=file.name.replace(/\.[^.]+$/,'');var rd=new FileReader();rd.onload=function(){img=new Image();img.onload=function(){var w=img.naturalWidth,h=img.naturalHeight;src.width=cut.width=fx.width=mask.width=w;src.height=cut.height=fx.height=mask.height=h;sc.clearRect(0,0,w,h);sc.drawImage(img,0,0);process();$('size').textContent=w+' × '+h;['cutCanvas','fxCanvas'].forEach(function(id){$(id).classList.remove('hidden')});['empty1','empty2','drop'].forEach(function(id){$(id).classList.add('hidden')});$('replace').classList.remove('hidden');['pngBtn','webmBtn','timeline'].forEach(function(id){$(id).disabled=false});$('status').textContent='已载入透明 PNG，可调节动态特效';};img.src=rd.result};rd.readAsDataURL(file)}
$('file').onchange=function(e){load(e.target.files[0])};$('replace').onclick=function(){$('file').click()};$('drop').ondragover=function(e){e.preventDefault();this.classList.add('drag')};$('drop').ondragleave=function(){this.classList.remove('drag')};$('drop').ondrop=function(e){e.preventDefault();this.classList.remove('drag');load(e.dataTransfer.files[0])};
['width','intensity','zoom','angle','sweep','pause'].forEach(function(id){$(id).oninput=function(){labels();start=performance.now()}});$('resetFx').onclick=function(){$('width').value=24;$('intensity').value=78;$('zoom').value=8;$('angle').value=-16;$('sweep').value=11;$('pause').value=25;labels();start=performance.now()};
$('classicFx').onclick=function(){effect='classic';this.classList.add('on');$('metalFx').classList.remove('on');$('flowFx').classList.remove('on');$('widthLabel').textContent='光带宽度';$('status').textContent='已切换：经典扫光';start=performance.now()};$('metalFx').onclick=function(){effect='metal';this.classList.add('on');$('classicFx').classList.remove('on');$('flowFx').classList.remove('on');$('widthLabel').textContent='爆闪范围';$('width').value=30;$('intensity').value=92;$('zoom').value=8;$('sweep').value=9;$('pause').value=26;labels();$('status').textContent='已切换：金属爆闪';start=performance.now()};$('flowFx').onclick=function(){effect='flow';this.classList.add('on');$('classicFx').classList.remove('on');$('metalFx').classList.remove('on');$('widthLabel').textContent='流光宽度';$('width').value=24;$('intensity').value=75;$('zoom').value=5;$('angle').value=0;$('sweep').value=52;$('pause').value=8;labels();$('status').textContent='已切换：金色流光（扫光+缩放）';start=performance.now()};document.querySelectorAll('.tabs button').forEach(function(b){b.onclick=function(){document.querySelectorAll('.tabs button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');var cls=b.dataset.bg==='checker'?'stage':'stage '+b.dataset.bg;$('cutStage').className=cls;$('fxStage').className=cls}});
$('pngBtn').onclick=function(){cc.putImageData(processed,0,0);var a=document.createElement('a');a.href=cut.toDataURL('image/png');a.download=name+'_透明底.png';a.click()};
$('webmBtn').onclick=async function(){if(!processed||exporting)return;var mime=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(function(x){return MediaRecorder.isTypeSupported(x)});if(!mime){$('status').textContent='当前浏览器不支持 WebM 导出';return}exporting=true;this.disabled=true;$('status').textContent='正在导出…';var stream=fx.captureStream(30),rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:10000000}),chunks=[];rec.ondataavailable=function(e){if(e.data.size)chunks.push(e.data)};var done=new Promise(function(r){rec.onstop=r});rec.start(100);var begin=performance.now();await new Promise(function(resolve){function go(n){var t=(n-begin)/1000;drawFx(Math.min(t,cycle()-.034));if(t<cycle())requestAnimationFrame(go);else resolve()}requestAnimationFrame(go)});rec.stop();await done;stream.getTracks().forEach(function(t){t.stop()});var a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type:mime}));a.download=name+'_扫光.webm';a.click();exporting=false;$('webmBtn').disabled=false;$('status').textContent='导出完成 · '+cycle().toFixed(1)+' 秒 · 30 fps';start=performance.now()};
labels();requestAnimationFrame(loop)})();
</script></body></html>
